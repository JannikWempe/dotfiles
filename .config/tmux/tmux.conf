# Reload this config (lowercase r enters resize mode below)
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support for scrolling
set -g mouse on

# Allow OSC 52 to set the clipboard (for copying over SSH)
set -g set-clipboard on

set -g extended-keys on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Mac
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

bind r switch-client -T resize
bind -T resize -r Left  resize-pane -L 5
bind -T resize -r Down  resize-pane -D 5
bind -T resize -r Up    resize-pane -U 5
bind -T resize -r Right resize-pane -R 5
bind -T resize Escape switch-client -T prefix
bind -T resize Enter  switch-client -T prefix

# Highlight active pane
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#3b4252'
# Always show every pane label, but color only the active pane's label
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=black]#[bg=#ffd866]#[bold],#[fg=#6b7280]#[bg=default]} #{pane_index}:#{pane_current_command} #[default]'

# Adopted explicitly from tmux-sensible (plugin dropped on purpose)
set -s escape-time 0
set -g history-limit 50000

### Plugins
# plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
# save/restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# auto-save sessions; keep last so nothing overwrites its status-right hook
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# init tpm; KEEP AT BOTTOM
run '~/.config/tmux/plugins/tpm/tpm'
