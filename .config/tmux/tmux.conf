### General behaviour

# Recognize escape immediately instead of waiting for a sequence (adopted from tmux-sensible)
set -s escape-time 0

# Keep more scrollback than the 2000-line default (adopted from tmux-sensible)
set -g history-limit 50000

# Enable mouse support for scrolling
set -g mouse on

# Forward extended key sequences (e.g. Ctrl+Shift combos) to apps like nvim
set -g extended-keys on

# Pass focus events to nvim so autoread picks up files changed by other panes (e.g. agent)
set -g focus-events on

# Show messages (e.g. "Reloaded!") long enough to read; default 750ms is too short
set -g display-time 2000


### Windows & panes

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# New windows/splits open in the current pane's directory instead of the session start dir
bind c   new-window   -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


### Copy mode & clipboard

# Allow OSC 52 to set the clipboard (for copying over SSH)
set -g set-clipboard on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Mac
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'


### Key bindings

# Reload this config (lowercase r enters resize mode below)
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Resize mode: Prefix r, then arrows (repeatable); Escape/Enter to leave
bind r switch-client -T resize
bind -T resize -r Left  resize-pane -L 5
bind -T resize -r Down  resize-pane -D 5
bind -T resize -r Up    resize-pane -U 5
bind -T resize -r Right resize-pane -R 5
bind -T resize Escape switch-client -T prefix
bind -T resize Enter  switch-client -T prefix


### Appearance

# Same border colour for all panes (the label below is the active indicator, not the border)
set -g @border-fg '#3b4252'
set -gF pane-border-style 'fg=#{@border-fg}'
set -gF pane-active-border-style 'fg=#{@border-fg}'

# Always show every pane label, but color only the active pane's label
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=black]#[bg=#ffd866]#[bold],#[fg=#6b7280]#[bg=default]} #{pane_index}:#{pane_current_command} #[default]'


### Plugins

# plugin manager
set -g @plugin 'tmux-plugins/tpm'
# adds prefix-F
set -g @plugin 'sainnhe/tmux-fzf'
# adds prefix-tab
set -g @plugin 'laktak/extrakto'
# save/restore sessions; adds prefix-ctrl-s and prefix-ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# auto-save sessions; keep last so nothing overwrites its status-right hook
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# init tpm; KEEP AT BOTTOM
run '~/.config/tmux/plugins/tpm/tpm'
